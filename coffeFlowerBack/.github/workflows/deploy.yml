name: Build and Deploy Coffee Flower

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Coffee Flower
        working-directory: coffeFlowerBack
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "coffeFlowerBack/build/libs/*.jar"
          target: "/home/ec2-user/coffeFlowerBack/"
          strip_components: 2

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Coffee Flower en EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Conectado a EC2"

            mkdir -p /home/ec2-user/coffeFlowerBack
            cd /home/ec2-user/coffeFlowerBack

            echo "Deteniendo aplicación anterior..."

            if [ -f coffeFlowerBack.pid ]; then
              PID=$(cat coffeFlowerBack.pid)

              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID"
                echo "Aplicación anterior detenida."
                sleep 3
              else
                echo "El proceso anterior ya no estaba ejecutándose."
              fi

              rm -f coffeFlowerBack.pid
            fi

            echo "Iniciando Coffee Flower..."

            nohup java -jar coffeFlowerBack.jar \
              --server.port=80 \
              > coffeFlowerBack.log 2>&1 &

            echo $! > coffeFlowerBack.pid

            echo "Coffee Flower iniciado con PID:"
            cat coffeFlowerBack.pid

            sleep 5

            echo "Proceso:"
            ps -p "$(cat coffeFlowerBack.pid)" -f || true

            echo "Últimas líneas del log:"
            tail -n 20 coffeFlowerBack.log
