
name: Build and Deploy Coffee Flower

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: coffeFlowerBack/gradle/wrapper/gradle-wrapper.properties

      - name: Build Coffee Flower
        working-directory: coffeFlowerBack
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

          mkdir -p build/deploy

          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No se encontró el JAR ejecutable."
            ls -la build/libs
            exit 1
          fi

          echo "JAR encontrado: $JAR_FILE"

          cp "$JAR_FILE" build/deploy/coffeFlowerBack.jar

          echo "JAR preparado para despliegue:"
          ls -lh build/deploy/coffeFlowerBack.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "coffeFlowerBack/build/deploy/coffeFlowerBack.jar"
          target: "/home/ec2-user/coffeFlowerBack/"
          strip_components: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Deploy Coffee Flower en EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Conectado a EC2"

            cd /home/ec2-user/coffeFlowerBack

            echo "Verificando JAR..."

            if [ ! -f coffeFlowerBack.jar ]; then
              echo "ERROR: No se encontró coffeFlowerBack.jar"
              ls -la
              exit 1
            fi

            echo "Comprobando Java..."
            java -version

            echo "Deteniendo aplicación anterior..."

            if [ -f coffeFlowerBack.pid ]; then
              PID=$(cat coffeFlowerBack.pid)

              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID"
                sleep 3

                if kill -0 "$PID" 2>/dev/null; then
                  kill -9 "$PID" || true
                fi
              fi

              rm -f coffeFlowerBack.pid
            fi

            echo "Iniciando Coffee Flower en puerto 8080..."

            nohup java -jar coffeFlowerBack.jar \
              --server.port=8080 \
              > coffeFlowerBack.log 2>&1 &

            echo $! > coffeFlowerBack.pid

            sleep 10

            PID=$(cat coffeFlowerBack.pid)

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: La aplicación no inició."
              tail -n 50 coffeFlowerBack.log
              rm -f coffeFlowerBack.pid
              exit 1
            fi

            echo "Aplicación iniciada:"
            ps -p "$PID" -f

            echo "Últimas líneas del log:"
            tail -n 20 coffeFlowerBack.log
