
name: Build and Deploy Coffee Flower

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: coffeFlowerBack/**/*.gradle*

      - name: Build Coffee Flower
        working-directory: coffeFlowerBack
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test
          mkdir -p build/deploy
          cp build/libs/*.jar build/deploy/coffeFlowerBack.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "coffeFlowerBack/build/deploy/coffeFlowerBack.jar"
          target: "/home/ec2-user/coffeFlowerBack/"
          strip_components: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Coffee Flower en EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Conectado a EC2"

            mkdir -p /home/ec2-user/coffeFlowerBack
            cd /home/ec2-user/coffeFlowerBack

            echo "Verificando archivo JAR..."

            if [ ! -f coffeFlowerBack.jar ]; then
              echo "ERROR: No se encontró coffeFlowerBack.jar"
              ls -la
              exit 1
            fi

            echo "Deteniendo aplicación anterior..."

            if [ -f coffeFlowerBack.pid ]; then
              PID=$(cat coffeFlowerBack.pid)

              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID"
                sleep 3

                if kill -0 "$PID" 2>/dev/null; then
                  kill -9 "$PID" || true
                fi

                echo "Aplicación anterior detenida."
              else
                echo "La aplicación anterior no estaba ejecutándose."
              fi

              rm -f coffeFlowerBack.pid
            fi

            echo "Iniciando Coffee Flower en el puerto 8080..."

            nohup java -jar coffeFlowerBack.jar \
              --server.port=8080 \
              > coffeFlowerBack.log 2>&1 &

            echo $! > coffeFlowerBack.pid

            sleep 10

            PID=$(cat coffeFlowerBack.pid)

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: Coffee Flower no inició correctamente."
              tail -n 50 coffeFlowerBack.log
              rm -f coffeFlowerBack.pid
              exit 1
            fi

            echo "Proceso de Coffee Flower:"
            ps -p "$PID" -f

            echo "Últimas líneas del log:"
            tail -n 20 coffeFlowerBack.log
